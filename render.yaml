services:
  - type: web
    name: todo-app
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        value: sqlite:////data/todos.db
    disk:
      name: sqlite-data
      mountPath: /data
      sizeGB: 1
